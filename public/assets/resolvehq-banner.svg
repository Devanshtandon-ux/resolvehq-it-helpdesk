<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="520" fill="url(#bgGrad)" rx="16" />
  <circle cx="200" cy="100" r="160" fill="#4338CA" opacity="0.22" filter="url(#dropGlow)" />
  <circle cx="1050" cy="400" r="180" fill="#7C3AED" opacity="0.25" filter="url(#dropGlow)" />

  <!-- Top Navigation Bar Mockup -->
  <rect x="50" y="35" width="1100" height="50" rx="12" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
  
  <!-- Logo Icon -->
  <rect x="70" y="47" width="26" height="26" rx="7" fill="url(#primaryGlow)" />
  <path d="M78 60 L82 64 L90 54" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <text x="105" y="65" fill="#FFFFFF" font-size="16" font-weight="800" class="font-sans" letter-spacing="-0.3">ResolveHQ</text>
  <rect x="195" y="50" width="80" height="20" rx="10" fill="#4338CA" fill-opacity="0.4" stroke="#6366F1" stroke-width="0.8" />
  <text x="235" y="64" fill="#A5B4FC" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">v2.5 PRO</text>

  <!-- Status indicator -->
  <circle cx="990" cy="60" r="4" fill="#10B981" />
  <text x="1002" y="64" fill="#94A3B8" font-size="11" class="font-sans">All Systems Operational</text>
  <rect x="1080" y="46" width="50" height="28" rx="8" fill="#4F46E5" />
  <text x="1105" y="64" fill="#FFFFFF" font-size="11" font-weight="600" class="font-sans" text-anchor="middle">Demo</text>

  <!-- Left Main Workspace View (Mock Dashboard) -->
  <rect x="50" y="105" width="700" height="375" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />

  <!-- Stat Cards Row -->
  <!-- Stat 1 -->
  <g transform="translate(75, 125)">
    <rect width="145" height="75" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="26" fill="#94A3B8" font-size="11" class="font-sans">Open Incidents</text>
    <text x="14" y="55" fill="#F8FAFC" font-size="24" font-weight="800" class="font-mono">0</text>
    <rect x="95" y="38" width="38" height="18" rx="6" fill="#10B981" fill-opacity="0.15" />
    <text x="114" y="51" fill="#34D399" font-size="9" font-weight="700" class="font-mono" text-anchor="middle">CLEAN</text>
  </g>

  <!-- Stat 2 -->
  <g transform="translate(235, 125)">
    <rect width="145" height="75" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="26" fill="#94A3B8" font-size="11" class="font-sans">SLA Target Met</text>
    <text x="14" y="55" fill="#38BDF8" font-size="24" font-weight="800" class="font-mono">99.4%</text>
    <circle cx="120" cy="47" r="10" fill="#38BDF8" fill-opacity="0.15" />
    <text x="120" y="51" fill="#38BDF8" font-size="10" text-anchor="middle">✓</text>
  </g>

  <!-- Stat 3 -->
  <g transform="translate(395, 125)">
    <rect width="145" height="75" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="26" fill="#94A3B8" font-size="11" class="font-sans">MTTR Velocity</text>
    <text x="14" y="55" fill="#A78BFA" font-size="24" font-weight="800" class="font-mono">1.8h</text>
    <text x="100" y="52" fill="#A78BFA" font-size="10" font-weight="600" class="font-sans">-34%</text>
  </g>

  <!-- Stat 4 -->
  <g transform="translate(555, 125)">
    <rect width="170" height="75" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="26" fill="#94A3B8" font-size="11" class="font-sans">AI Copilot Status</text>
    <text x="14" y="55" fill="#F43F5E" font-size="16" font-weight="700" class="font-sans">Active &amp; Ready</text>
    <rect x="130" y="38" width="28" height="18" rx="6" fill="#F43F5E" fill-opacity="0.15" />
    <text x="144" y="50" fill="#FB7185" font-size="9" font-weight="800" class="font-mono" text-anchor="middle">AI</text>
  </g>

