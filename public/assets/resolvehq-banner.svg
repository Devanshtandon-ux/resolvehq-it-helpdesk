  <text x="75" y="230" fill="#F1F5F9" font-size="14" font-weight="700" class="font-sans">Active SLA Incident Stream</text>
  <rect x="585" y="215" width="140" height="26" rx="8" fill="#312E81" stroke="#4338CA" stroke-width="0.8" />
  <text x="655" y="232" fill="#C7D2FE" font-size="10" font-weight="600" class="font-sans" text-anchor="middle">+ Create Live Ticket</text>

  <!-- Table Header -->
