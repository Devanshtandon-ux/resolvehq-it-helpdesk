    <text x="607" y="25" fill="#A5B4FC" font-size="10" font-weight="700" class="font-sans" text-anchor="middle">IN PROG</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(75, 335)">
    <rect width="650" height="42" rx="8" fill="#1E293B" fill-opacity="0.3" stroke="#334155" stroke-width="0.8" />
    <text x="15" y="25" fill="#818CF8" font-size="11" font-weight="700" class="font-mono">RHQ-1081</text>
    <text x="135" y="24" fill="#F8FAFC" font-size="12" font-weight="600" class="font-sans">VPN TLS auto-renewal handshake failure</text>
    <rect x="360" y="12" width="60" height="20" rx="6" fill="#F97316" fill-opacity="0.15" />
    <text x="390" y="25" fill="#FB923C" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">HIGH</text>
    <text x="480" y="25" fill="#10B981" font-size="11" font-weight="600" class="font-mono">⏱ 04h 15m</text>
    <rect x="580" y="12" width="55" height="20" rx="6" fill="#3B82F6" fill-opacity="0.18" />
    <text x="607" y="25" fill="#93C5FD" font-size="10" font-weight="700" class="font-sans" text-anchor="middle">OPEN</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(75, 385)">
    <rect width="650" height="42" rx="8" fill="#1E293B" fill-opacity="0.3" stroke="#334155" stroke-width="0.8" />
    <text x="15" y="25" fill="#818CF8" font-size="11" font-weight="700" class="font-mono">RHQ-1080</text>
    <text x="135" y="24" fill="#F8FAFC" font-size="12" font-weight="600" class="font-sans">M4 MacBook Pro &amp; YubiKey Provisioning</text>
    <rect x="360" y="12" width="60" height="20" rx="6" fill="#EAB308" fill-opacity="0.15" />
    <text x="390" y="25" fill="#FDE047" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">MEDIUM</text>
    <text x="480" y="25" fill="#94A3B8" font-size="11" font-weight="600" class="font-mono">⏱ 18h 30m</text>
    <rect x="580" y="12" width="55" height="20" rx="6" fill="#10B981" fill-opacity="0.18" />
    <text x="607" y="25" fill="#6EE7B7" font-size="10" font-weight="700" class="font-sans" text-anchor="middle">SOLVED</text>
  </g>

  <!-- Right Floating Panel: Gemini AI Smart Copilot -->
  <rect x="775" y="105" width="375" height="375" rx="16" fill="#0F172A" stroke="#4338CA" stroke-width="1.4" />
  
  <!-- AI Card Header -->
  <rect x="775" y="105" width="375" height="55" rx="16" fill="#1E1B4B" fill-opacity="0.7" />
  <rect x="795" y="120" width="28" height="28" rx="8" fill="url(#primaryGlow)" />
  <text x="809" y="138" fill="#FFFFFF" font-size="14" font-weight="bold" class="font-sans" text-anchor="middle">✨</text>
  <text x="835" y="132" fill="#F8FAFC" font-size="13" font-weight="700" class="font-sans">Gemini 2.5 Flash Copilot</text>
  <text x="835" y="146" fill="#A5B4FC" font-size="10" class="font-sans">Automated Root-Cause Diagnostic</text>

  <!-- AI Diagnosis Box -->
  <g transform="translate(795, 175)">
    <rect width="335" height="110" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="14" y="24" fill="#38BDF8" font-size="10" font-weight="800" class="font-mono">DETECTION ENGINE ANALYSIS</text>
    <text x="14" y="46" fill="#F1F5F9" font-size="11" font-weight="600" class="font-sans">Query Planner Lock on WAL Writer</text>
    <text x="14" y="65" fill="#94A3B8" font-size="10" class="font-sans">Killed long-running PID 44812. Read replica lag</text>
    <text x="14" y="80" fill="#94A3B8" font-size="10" class="font-sans">dropped from 450s to 12s in 90 seconds.</text>
    <rect x="14" y="88" width="90" height="16" rx="4" fill="#10B981" fill-opacity="0.2" />
    <text x="59" y="99" fill="#34D399" font-size="9" font-weight="700" class="font-mono" text-anchor="middle">CONFIDENCE: 98%</text>
  </g>

  <!-- AI Action Buttons -->
  <g transform="translate(795, 300)">
    <rect width="335" height="42" rx="8" fill="#4338CA" />
    <text x="167" y="26" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans" text-anchor="middle">✨ Draft Customer Incident Resolution</text>
  </g>

  <g transform="translate(795, 350)">
    <rect width="335" height="42" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="167" y="26" fill="#E2E8F0" font-size="12" font-weight="600" class="font-sans" text-anchor="middle">⚡ Auto-Categorize &amp; Assign Tier-2</text>
  </g>

  <!-- Bottom Badge in Card -->
  <g transform="translate(795, 405)">
    <text x="0" y="20" fill="#64748B" font-size="10" class="font-mono">Server-Authoritative RBAC · Node.js + Express</text>
  </g>
</svg>
