  <text x="90" y="268" fill="#64748B" font-size="10" font-weight="700" class="font-mono">TICKET ID</text>
  <text x="210" y="268" fill="#64748B" font-size="10" font-weight="700" class="font-mono">SUBJECT</text>
  <text x="440" y="268" fill="#64748B" font-size="10" font-weight="700" class="font-mono">PRIORITY</text>
  <text x="540" y="268" fill="#64748B" font-size="10" font-weight="700" class="font-mono">SLA WINDOW</text>
  <text x="660" y="268" fill="#64748B" font-size="10" font-weight="700" class="font-mono">STATUS</text>

  <!-- Row 1 -->
  <g transform="translate(75, 285)">
