    <text x="15" y="25" fill="#818CF8" font-size="11" font-weight="700" class="font-mono">RHQ-1082</text>
    <text x="135" y="24" fill="#F8FAFC" font-size="12" font-weight="600" class="font-sans">PostgreSQL replication lag &gt; 450s</text>
